# ==========================================================================
# CAMPAIGN 2 -- resolving the blockers the first campaign reported honestly.
# Appended 2026-09-20. Never edit an entry above to make a result look better.
# ==========================================================================
campaign_2:
  EXP-024:
    title: Repository / remote reconciliation
    phase: 24
    status: complete
    gate: PASS
    report: reports/repository_remote_reconciliation.md
    finding: >
      NO DISCREPANCY. local HEAD == origin/main == faa2849, 25 commits, clean tree,
      single branch. The reported "one commit, skeleton" web view is an exact
      description of 6d657fe, the FIRST commit, and is best explained as a stale
      page. No history was lost, rewritten or mispushed. No recovery action taken.
    note: >
      The git repository is oran-ids-deployability/ INSIDE the working folder, not
      the folder itself. `git log` one level up reports "not a git repository",
      which resembles a lost history and is not one.

  EXP-025:
    title: Target corpus acquisition and verification (D_B = 5G-NIDD)
    phase: 25
    status: complete
    gate: PASS
    closes: [D-011, "gate A1-target"]
    report: reports/EXP-025_target_corpus.md
    claims: [C2, C3, C4]
    corpus: configs/corpora/d_b.yaml
    provenance: data/provenance/d_b_files.json
    route: >
      Etsin / Fairdata, the Finnish national research data repository. Open, CC BY 4.0,
      own citable DOI 10.23729/e80ac9df-d9fb-47e7-8d0d-01384a415361. NOT the paywalled
      IEEE DataPort copy and NOT an unattributable third-party mirror.
    verified:
      checksums: "all 4 artefacts re-verified 2026-09-20; compressed sizes matched the
                  repository's published record to the byte before extraction"
      rows: 1215890
      cols: 52
      exporter: Argus
      attack_prevalence_pct: 60.71
      identifier_columns: none
      canonical_coverage: [benign, dos, probe]
      untestable_in_transfer: [ddos, bruteforce, web]
    finding: >
      RQ1 is UNBLOCKED. reports/RQ1_blocked.md is deliberately NOT written; that
      branch of the decision tree does not apply.

  EXP-026:
    title: Cross-deployment transfer D_A -> D_B (RQ1, the headline)
    phase: 26
    status: negative_result
    gate: PASS
    report: reports/EXP-026_cross_deployment_transfer.md
    outcome: >
      COMPLETE, both directions, 20 seeds each. Transfer largely FAILS and the
      result is preserved, not re-run. Forward: 6/6 significant after Holm, best
      architecture clears the stratified floor by 0.148, mlp lands BELOW it at
      0.4223 with balanced accuracy 0.4966. Reverse: 6/6 significant, and WORSE --
      tree (0.3430) and rf (0.3365) fall below BOTH floors on D_A. Symmetry rules
      out "D_B is simply harder".
    rank_finding: >
      In-distribution score does not predict transfer. The source-best
      architecture ranks LAST of six on the target; Spearman rho +0.143, p 0.787.
    mechanism: >
      Categories present in the training corpus transfer; categories absent from
      it do not. D_B has no web attacks, and web recall on D_A is 0.004-0.013 for
      four of six architectures.
    depends_on: [EXP-025]
    claims: [C2, C3, C4]
    maps_to_plan: [X2]
    runner: experiments/run_transfer.py
    design:
      space: configs/features/shared_space.yaml
      n_shared_concepts: 15
      n_matrix_columns: 18
      draft_claimed: 24
      source_split: group_disjoint(src_ip)
      split_seeds: 20
      model_seed: 11
      threshold: 0.5
      primary_metric: f1_macro
      controls:
        - source held-out in the SAME 18-column space, so the gap is not the projection
        - trivial floor evaluated ON THE TARGET, so a collapse reads against guessing
      directions:
        a_to_b: primary, run and committed first
        b_to_a: secondary symmetry check only (D-017); D_B has no group key, so its
                own held-out reference is a RANDOM split and an optimistic bound
    decisions: [D-015, D-016, D-017]
    bug_caught_pre_result: >
      D-015. The handover mapping src_bytes <-> SrcBytes was WRONG: Zeek src_bytes is
      payload (median 0), Argus SrcBytes is header-inclusive (median 84). It would have
      collapsed the target score across every architecture and looked exactly like the
      generalisation failure the paper set out to find. Corrected to src_ip_bytes before
      any transfer metric was computed. Regression test added.
    hard_rule: >
      Delta_F1 is an UPPER BOUND spanning an independent deployment AND an independent
      exporter. The A3 single-exporter control is NOT applied. Never write "due to
      deployment shift".

  EXP-027:
    title: Prevalence sensitivity and the PPV estimator bug
    phase: 27
    status: complete
    gate: PASS
    runner: experiments/run_prevalence_sensitivity.py
    decisions: [D-018]
    bug: B-E
    method: analytic sweep over POOLED confusion counts; no model refitted
    finding: >
      The operational-precision result does not depend on pi. It depended on how
      PPV was averaged. PPV is non-linear in FPR near zero, EXP-004 averaged PPV
      across folds, and any fold with FPR=0 contributed 1.000. Same data, three
      estimators: pooled 1.40x, median 1.73x, mean 13.18x. The mean was published
      as 6x. Pooled counts are primary from here on; mean and median are reported
      beside them so the artefact stays visible.
    surviving_claim: >
      Corpus precision ~0.93 against pooled deployment PPV 0.0055-0.0077, a 132x
      collapse at pi=0.002, rising to 2,631x at pi=1e-4. The detectors are
      operationally indistinguishable at every base rate swept.
    also_found: >
      FPR is not a stable property of these detectors: 0.000 to 0.890 across
      group-disjoint folds. Any single-number FPR for this corpus is close to
      meaningless without that range beside it.
    separability_verified: >
      PPV is lambda_b-invariant (max variation 2.2e-16) and alert volume is
      exactly linear in lambda_b (max deviation 3.7e-9), checked numerically
      rather than asserted.

  EXP-028:
    title: Calibration and operational-threshold audit
    phase: 28
    status: complete
    gate: PASS
    runner: experiments/run_calibration.py
    calibrators: [raw, platt, isotonic, temperature]
    split: group-disjoint three-way train/calibration/test on src_ip
    hard_rule: >
      No calibrator is ever fitted on the target. The prior-corrected variants
      consume the TARGET prior, are labelled ORACLE, are an upper bound on what
      prior correction could buy, and carry no claim.
    bug_found: >
      Isotonic regression returns exactly 1.0 and inherits float32 from the score
      array. In float32, 1 - 1e-9 rounds to 1.0, so the clip in prior_correct was
      a no-op, 1-p was 0, the odds were +inf and inf/(1+inf) was NaN. It crashed
      three functions downstream in sklearn, which is the good failure mode -- the
      same bug in a metric that tolerates NaN would have quietly poisoned a mean.
      Fixed by casting to float64 before clipping, with a finiteness assertion.

  EXP-029:
    title: Network-layer grouping confound
    phase: 29
    status: partial
    runner: experiments/run_grouping_confound.py
    part_c_complete: true
    part_c_finding: >
      Test-fold composition does NOT explain the 0.000-0.890 FPR range. Mean R^2
      across predictors 0.04-0.06, max 0.36, 1 of 7 significant. It is WHICH
      groups land in test, not how many or their class balance.
    parts_outstanding: [A, B]
    hard_rule: >
      Until parts A and B land, the network layer stays a directional cross-check
      per D-013 and no per-layer claim rests on it.

  EXP-030:
    title: Native feature-extraction benchmark
    phase: 30
    status: complete
    gate: PASS
    runner: experiments/run_extraction_benchmark.py
    new_module: src/oran_ids/ingest/fast_exporter.py
    finding: >
      A vectorised extractor is 2.3x to 12.1x faster than the per-packet reference
      and agrees with it exactly -- 0 packet mismatches, 0 byte mismatches, 100%
      bulk-parse coverage. The speedup tracks packets-per-flow. The reference is
      flat at 63-78 us/packet whatever the shape, which is the per-packet Python
      interpretation cost.
    verdict: >
      The C10 finding SURVIVES optimisation. Best vectorised extraction is 0.058
      ms/flow; against real-RIC inference (1-5 us logreg, 10-25 us MLP) that is
      still 19x and 3x. Smaller than the 7-39x measured against Python inference,
      same sign, now resting on a measurement rather than a caveat.
    caveat: >
      Captures are SYNTHETIC -- D-010 stopped the pcap download and the originals
      are gone. Calibration against the real captures is reported either way.

  EXP-031:
    title: Real Near-RT RIC runtime
    phase: 31
    status: blocked
    gate: BLOCKED
    report: reports/EXP-031_real_ric_blocked.md
    blocker: >
      Command-verified: wsl -d Ubuntu fails with HCS_E_SERVICE_NOT_AVAILABLE. The
      Windows Virtual Machine Platform feature is not installed, so WSL2 cannot
      start a VM, and Docker Desktop's Linux engine runs on WSL2 and fails too.
      Docker 29.6.2, kubectl 1.36.1 and a registered Ubuntu ARE present.
      Unblocking needs administrator rights and a reboot.
    why_not_forced: >
      Even with WSL2 there would be no CPU isolation, and tail latency is what a
      noisy scheduler destroys. The outcome would have been a third emulated
      measurement wearing the word "real".
    scientific_content: >
      A negative result about our own method. Obiuwevwi et al. measure 1-5 us for
      logistic regression on a real RIC; we measure 2.45 ms p50 for the same
      family. Three orders of magnitude is not hardware -- it is a compiled
      embedded model against a Python object graph. The near-RT crossing point is
      a property of the implementation, not the architecture.

  EXP-033:
    title: Adversarial and degraded-telemetry robustness
    phase: 33
    status: complete
    runner: experiments/run_adversarial.py
    was_cut_by: D-009
    scope_note: >
      NOT first. Adversarial attacks on O-RAN ML are prior art (arXiv:2309.03844,
      arXiv:2510.18160, arXiv:2505.05537, WiSec 2024). What is added is the
      operational reading: every attack scored on alert burden and on whether the
      operating threshold still reaches a usable PPV, not on accuracy alone.
    threat_models:
      evasion_unconstrained: >
        UPPER BOUND, not realisable -- it permits reducing bytes and packets
        already sent.
      evasion_constrained: >
        The realistic number. An attacker can pad and delay but cannot un-send,
        so only increases to bytes, packets and duration are allowed.
    never_perturbed: >
      The protocol one-hot. Perturbing it produces a vector corresponding to no
      packet.

  EXP-034:
    title: Temporal and configuration drift
    phase: 34
    status: complete
    runner: experiments/run_drift.py
    layer: radio only -- the network layer has NO time column
    design: >
      Real time, not simulated drift. D_A's radio layer spans 52.96 days and
      session ids are assigned by cumsum over time-sorted records, so the session
      index IS the temporal order. Train on the earliest sessions, test on the
      latest, sweep the boundary, and compare against a control with the same
      session counts drawn at random rather than by time.
    why_the_control_matters: >
      Without it a temporal drop cannot be told apart from the ordinary variance
      of which sessions land in test, and EXP-027 found that variance is enormous.
    power_note: >
      30 sessions detects a large effect and nothing subtler. Stated up front
      rather than discovered in review.

  EXP-035:
    title: Multi-dimensional deployability
    phase: 35
    status: complete
    runner: analysis/deployability.py
    no_composite_score: >
      Deliberate, and required by the brief. Collapsing latency, burden and
      transfer into one number needs weights, the weights are unmeasurable, and
      whoever picks them picks the winner.
    finding: >
      All six architectures are Pareto-efficient over eight axes. Naming the axis
      each one wins is the usable result: logreg takes the three operational axes
      (deployment PPV, false alerts/hour, drift robustness), rf takes the three
      detection axes (target F1, distance above the floor, Brier), tree takes p99
      latency, and mlp wins only source F1 -- the metric a paper reports, and
      nothing else.
    concrete: >
      logreg emits 5,620 false alerts/hour against rf's 129,843, a factor of 23,
      while rf is 0.042 macro-F1 better on the target.
    unmeasured_dimensions: [cpu_under_load, ram_under_load, integration_complexity]
    unmeasured_policy: >
      Carried as NaN columns so their absence is visible, excluded from the
      frontier with the exclusion printed, never imputed.

