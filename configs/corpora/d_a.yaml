# D_A -- VERIFIED AT ARTEFACT LEVEL by EXP-001 on 2026-09-20.
#
# Gate A1 asked for a corpus with (i) packet-level traces, (ii) synchronised radio
# KPIs and (iii) labelled attack traffic, from a real O-RAN deployment. EXP-001
# downloaded the summary artefacts and checked. Findings, in short:
#
#   (i)   packet-level flow features  CONFIRMED (1,723,817 Zeek-derived records)
#   (ii)  radio KPIs                  CONFIRMED (45,244 records, 22 PHY/MAC metrics, 1 Hz)
#   (iii) attack labels               CONFIRMED (6 categories, both layers)
#   SYNCHRONISED between (i) and (ii) NOT CONFIRMED -- and not possible from these
#         artefacts. The network CSV has no time column and shares no identifier with
#         the radio layer. See cu_du_join below. Claim C5's pre-registered failure
#         criterion fired.
#
# Full report: reports/experiments/EXP-001.md
# See configs/decisions.md D-001, D-004 and D-008.

